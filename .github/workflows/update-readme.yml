name: Update README

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update latest merged PRs section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, re, subprocess
          query = "search/issues?q=repo:ccxt/ccxt+type:pr+author:rayBastard+is:merged&sort=updated&order=desc&per_page=5"
          items = json.loads(subprocess.check_output(["gh", "api", query]))["items"]
          lines = [f"- [{i['title']}]({i['html_url']}) · {i['closed_at'][:10]}" for i in items]
          block = "<!-- CCXT-PRS:START -->\n" + "\n".join(lines) + "\n<!-- CCXT-PRS:END -->"
          with open("README.md") as f:
              readme = f.read()
          readme = re.sub(r"<!-- CCXT-PRS:START -->.*?<!-- CCXT-PRS:END -->", lambda m: block, readme, flags=re.S)
          with open("README.md", "w") as f:
              f.write(readme)
          EOF
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update latest merged PRs"
            git push
          fi
