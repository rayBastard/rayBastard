name: Update README

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CCXT PR sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, re, subprocess

          def fetch(query):
              return json.loads(subprocess.check_output(["gh", "api", query]))["items"]

          def replace(readme, start, end, lines):
              block = f"{start}\n" + "\n".join(lines) + f"\n{end}"
              return re.sub(re.escape(start) + r".*?" + re.escape(end), lambda m: block, readme, flags=re.S)

          merged = fetch("search/issues?q=repo:ccxt/ccxt+type:pr+author:rayBastard+is:merged&sort=updated&order=desc&per_page=5")
          opened = fetch("search/issues?q=repo:ccxt/ccxt+type:pr+state:open+author:rayBastard&sort=updated&order=desc&per_page=5")

          with open("README.md") as f:
              readme = f.read()
          readme = replace(readme, "<!-- CCXT-PRS:START -->", "<!-- CCXT-PRS:END -->",
                           [f"- [{i['title']}]({i['html_url']}) · {i['closed_at'][:10]}" for i in merged])
          readme = replace(readme, "<!-- CCXT-OPEN-PRS:START -->", "<!-- CCXT-OPEN-PRS:END -->",
                           [f"- [{i['title']}]({i['html_url']}) · opened {i['created_at'][:10]}" for i in opened])
          with open("README.md", "w") as f:
              f.write(readme)
          EOF
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update CCXT PR sections"
            git push
          fi
