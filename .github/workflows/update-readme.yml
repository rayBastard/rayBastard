name: Update README

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CCXT PR sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, re, subprocess

          USER = "rayBastard"

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          def replace(readme, start, end, lines):
              block = f"{start}\n" + "\n".join(lines) + f"\n{end}"
              return re.sub(re.escape(start) + r".*?" + re.escape(end), lambda m: block, readme, flags=re.S)

          landed = [(i["closed_at"][:10], i["title"], i["html_url"]) for i in api(
              f"search/issues?q=repo:ccxt/ccxt+type:pr+author:{USER}+is:merged&sort=updated&order=desc&per_page=20")["items"]]

          # maintainers also ship PRs inside batch commits, which closes them unmerged
          batched = {}
          for commit in api("repos/ccxt/ccxt/commits?sha=master&per_page=100"):
              subject = commit["commit"]["message"].split("\n")[0]
              if re.search(r"(?i)\bbatch\b", subject):
                  for number in re.findall(r"#(\d+)", subject):
                      batched.setdefault(number, commit["commit"]["committer"]["date"][:10])
          if batched:
              for i in api(f"search/issues?q=repo:ccxt/ccxt+type:pr+author:{USER}+is:closed+is:unmerged&sort=updated&order=desc&per_page=50")["items"]:
                  date = batched.get(str(i["number"]))
                  if date:
                      landed.append((date, i["title"], i["html_url"]))
          landed.sort(reverse=True)

          opened = api(f"search/issues?q=repo:ccxt/ccxt+type:pr+state:open+author:{USER}&sort=updated&order=desc&per_page=5")["items"]

          with open("README.md") as f:
              readme = f.read()
          readme = replace(readme, "<!-- CCXT-PRS:START -->", "<!-- CCXT-PRS:END -->",
                           [f"- [{title}]({url}) · {date}" for date, title, url in landed[:5]])
          readme = replace(readme, "<!-- CCXT-OPEN-PRS:START -->", "<!-- CCXT-OPEN-PRS:END -->",
                           [f"- [{i['title']}]({i['html_url']}) · opened {i['created_at'][:10]}" for i in opened])
          with open("README.md", "w") as f:
              f.write(readme)
          EOF
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update CCXT PR sections"
            git push
          fi
